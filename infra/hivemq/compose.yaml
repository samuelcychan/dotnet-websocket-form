name: websocket-telemetry
services:
  hivemq:
    image: hivemq/hivemq-ce:2026.5@sha256:bac6d4d1d815bffe4bc9a7fca8d06ea12b32d34f84ef2f1851ff4548560ee67b
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - hivemq-data:/opt/hivemq/data
    restart: unless-stopped
volumes:
  hivemq-data:
